[package]
name = "adjutant"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.36"
egui = "0.36"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
secret-service = { version = "5", features = ["crypto-rust"] } # declared, unused until M2
libc = "0.2"          # unix flock for single-instance lock
imap = { version = "=3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] } # pinned; fallback 2.4.1 noted in spec §1
mailparse = "0.17"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls-tls", "builder"] }
chrono-tz = "0.10"
notify-rust = "4"

[lints.clippy]
unwrap_used = "warn"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe"] }
